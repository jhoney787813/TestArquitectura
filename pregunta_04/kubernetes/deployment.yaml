apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-api-deployment
  namespace: default
  labels:
    app: security-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: security-api
  template:
    metadata:
      labels:
        app: security-api
    spec:
      containers:
      - name: security-api
        image: security-api:v4.0
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        env:
        - name: JWT_SECRET_KEY
          value: "SuperSecretArchitectureKeyForJwtSigning2026!#$"
