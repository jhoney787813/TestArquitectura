apiVersion: v1
kind: Service
metadata:
  name: policy-api-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: policy-api

---

apiVersion: v1
kind: Service
metadata:
  name: notification-worker-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 8090
    targetPort: 8090
  selector:
    app: notification-worker

---

apiVersion: v1
kind: Service
metadata:
  name: mock-gateways-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 8091
    targetPort: 8091
  selector:
    app: mock-gateways
