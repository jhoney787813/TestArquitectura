apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-api-deployment
  namespace: default
  labels:
    app: observability-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: observability-api
  template:
    metadata:
      labels:
        app: observability-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: observability-api
        image: observability-api:v5.0
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
